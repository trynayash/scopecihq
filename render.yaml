services:
  - type: web
    name: scopeci
    env: node
    plan: free
    # Render's Node image already wires up pnpm via Corepack from the
    # `packageManager` field in package.json — running `corepack enable`
    # ourselves collides with a pnpm shim Render ships on a read-only path.
    # Render exposes this service's env vars during the build too, so the
    # NODE_ENV=production set below would make pnpm skip devDependencies —
    # which is where the entire build toolchain lives (typescript, vite,
    # esbuild, tailwindcss, @types/node). Override it for just the install
    # step; the running server still gets NODE_ENV=production at runtime.
    buildCommand: >-
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm run typecheck &&
      PORT=3000 BASE_PATH=/ pnpm --filter @workspace/scopeci run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Set in the Render dashboard, not here — this file is committed to a
      # public repo. Render → this service → Environment → Add Environment
      # Variable. See .env.example for the Supabase connection string shape.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false

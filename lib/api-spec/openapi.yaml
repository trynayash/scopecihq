openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waitlist
    description: Early access signup operations
  - name: contact
    description: >-
      The contact form. ScopeCI publishes no email address: messages are stored and read on the admin page, and
      answered by email.
  - name: admin
    description: The admin page. Every route needs the admin session cookie (or ADMIN_SECRET as a bearer token).
  - name: demo
    description: The public "try it with your SOW" demo. Nothing is stored.
  - name: session
    description: Signing in with GitHub and out again
  - name: projects
    description: Projects, their confirmed scope, connected repository and checked pull requests
  - name: workspace
    description: Workspace members and invites
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: >-
            Running, but the database schema hasn't been brought up to date since this instance started (status
            schema_behind); it keeps retrying. A deploy in this state shouldn't take traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /waitlist:
    post:
      operationId: createWaitlistSignup
      tags: [waitlist]
      summary: Join the ScopeCI waitlist
      description: Stores an agency contact for early access updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistSignupInput"
      responses:
        "201":
          description: Waitlist signup created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistSignup"
        "409":
          description: Email is already on the waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid waitlist signup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contact:
    post:
      operationId: createContactMessage
      tags: [contact]
      summary: Send ScopeCI a message
      description: >-
        Stores the message for ScopeCI to read on the admin page and answer by email. Text is trimmed and control
        characters are removed before the limits are checked. Only what the form asks for is kept: no IP address,
        user agent or cookie. Messages are deleted after 365 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "201":
          description: Message received. Also the answer when the hidden `website` field is filled, though nothing is stored then.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageReceived"
        "400":
          description: A field is missing or not valid; `error` is one sentence naming it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: >-
            Five messages from this IP address in the last 10 minutes, or ScopeCI has taken as many messages as it
            can today (300, counted per UTC day); `message` is the sentence to show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimited"
        "503":
          description: The database can't be reached right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /demo/sow:
    post:
      operationId: parseDemoSow
      tags: [demo]
      summary: Read the scope out of a statement of work
      description: Splits the document into clauses and lists what each one includes and excludes, for the visitor to review and correct.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoSowInput"
      responses:
        "200":
          description: The scope as read from the document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoScope"
        "400":
          description: Missing, oversized or unreadable document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /demo/evaluate:
    post:
      operationId: evaluateDemo
      tags: [demo]
      summary: Check a pull request against a reviewed scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoEvaluationInput"
      responses:
        "200":
          description: The result, the PR comment it would post and, when work is out of scope, a change order draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoEvaluation"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /demo/github-pr:
    get:
      operationId: getDemoGithubPr
      tags: [demo]
      summary: Read a public GitHub pull request's title, branch and changed files
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            maxLength: 300
      responses:
        "200":
          description: The pull request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoPullRequest"
        "400":
          description: Not a GitHub pull request URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The pull request doesn't exist or isn't public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: GitHub didn't answer, or its anonymous rate limit was reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /session:
    get:
      operationId: getSession
      tags: [session]
      summary: Who is signed in, and whether GitHub sign-in is set up on this server
      responses:
        "200":
          description: The current session; user and organization are null when nobody is signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
    delete:
      operationId: endSession
      tags: [session]
      summary: Sign out
      responses:
        "204":
          description: Signed out
  /session/workspace:
    put:
      operationId: switchWorkspace
      tags: [session]
      summary: Work in another workspace the signed-in person belongs to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchWorkspaceInput"
      responses:
        "200":
          description: The workspace now in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOrganization"
        "404":
          description: Not a workspace this person belongs to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: The current workspace, its members and, for owners, its open invites
      responses:
        "200":
          description: The workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInfo"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateWorkspace
      tags: [workspace]
      summary: Rename the workspace (owners only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateInput"
      responses:
        "200":
          description: The workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInfo"
        "403":
          description: Only owners can do this
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workspace/invites:
    post:
      operationId: createInvite
      tags: [workspace]
      summary: Make a single-use invite link, valid for seven days (owners only)
      responses:
        "201":
          description: The invite; its link is only shown this once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        "403":
          description: Only owners can do this
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workspace/invites/{inviteId}:
    delete:
      operationId: revokeInvite
      tags: [workspace]
      summary: Cancel an invite that hasn't been used (owners only)
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      responses:
        "204":
          description: Cancelled
        "404":
          description: No such open invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workspace/members/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          maxLength: 36
    patch:
      operationId: changeMemberRole
      tags: [workspace]
      summary: Make someone an owner or a member (owners only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleInput"
      responses:
        "200":
          description: Their membership now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only owners change roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The workspace would be left without an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeMember
      tags: [workspace]
      summary: Remove someone from the workspace (owners), or leave it (anyone, with their own id)
      responses:
        "204":
          description: Removed
        "404":
          description: Not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only owners remove other people
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The workspace would be left without an owner, or it is the person's only workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /invites/{token}:
    get:
      operationId: getInvite
      tags: [workspace]
      summary: Which workspace an invite link is for
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: The invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: The link is wrong, used, cancelled or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /invites/{token}/accept:
    post:
      operationId: acceptInvite
      tags: [workspace]
      summary: Join the workspace an invite link is for, and switch to it
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: The workspace joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOrganization"
        "404":
          description: The link is wrong, used, cancelled or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/archived:
    get:
      operationId: listArchivedProjects
      tags: [projects]
      summary: The organization's archived projects, most recently archived first
      responses:
        "200":
          description: Archived projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
  /projects/{projectId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: restoreProject
      tags: [projects]
      summary: Bring an archived project back; its repository has to be connected again
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: No such archived project in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: The signed-in organization's projects
      responses:
        "200":
          description: Projects, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createProject
      tags: [projects]
      summary: Start a project for one client engagement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateInput"
      responses:
        "201":
          description: The new project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [projects]
      summary: A project and its confirmed scope
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: No such project in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Change a project's name, client, hourly rate or how strict its check is
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateInput"
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such project in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: archiveProject
      tags: [projects]
      summary: Archive a project and stop checking its repository
      responses:
        "204":
          description: Archived
        "404":
          description: No such project in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}/scope:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: saveProjectScope
      tags: [projects]
      summary: Save a confirmed scope checklist as the project's new active baseline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoScopeInput"
      responses:
        "200":
          description: The saved scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedScope"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such project in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}/repository:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: linkProjectRepository
      tags: [projects]
      summary: Check pull requests from this repository against the project's scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryLinkInput"
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Not signed in, or GitHub access expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The signed-in person can't see that installation or repository on GitHub
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The repository or GitHub account is already connected elsewhere
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unlinkProjectRepository
      tags: [projects]
      summary: Stop checking this project's repository
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: No such project in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}/change-order:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: updateChangeOrder
      tags: [projects]
      summary: Track the change order for a flagged pull request, price it, and record what the client decided
      description: >-
        Creates the change order for the pull request behind the given result on first use. Hours are priced at
        the project's hourly rate. An approved change order covers that work on this and later pull requests,
        and the pull request is checked again straight away.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOrderUpdateInput"
      responses:
        "200":
          description: The change order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedChangeOrder"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such project or result in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The result has nothing to change-order, or the change order was already decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}/pull-requests/{number}/acceptance:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: number
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: acceptPullRequest
      tags: [projects]
      summary: Let a flagged pull request through without a change order
      description: >-
        Records why, and checks the pull request again so GitHub's check passes. It stays accepted on later pushes
        unless they add excluded work the acceptance didn't cover.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptanceInput"
      responses:
        "200":
          description: The acceptance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptanceRecorded"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such project or pull request in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The pull request's latest result isn't flagged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: withdrawPullRequestAcceptance
      tags: [projects]
      summary: Withdraw an acceptance, so the pull request is judged on its own again
      parameters:
        - name: evaluationId
          in: query
          required: false
          schema:
            type: string
            maxLength: 36
          description: The result shown (PullRequestResult.evaluationId), naming the exact pull request as for accepting.
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptanceWithdrawn"
        "404":
          description: No such project, pull request or acceptance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}/recheck:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: recheckProject
      tags: [projects]
      summary: Check the repository's open pull requests again
      description: >-
        Lists the open pull requests on the project's repository (newest first, at most 30) and checks each
        against the current scope, in the background. Pull requests opened before the repository was connected
        get their first result this way.
      responses:
        "202":
          description: The re-check has started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecheckStarted"
        "404":
          description: No such project in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The project has no repository connected or no confirmed scope yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}/pull-requests:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectPullRequests
      tags: [projects]
      summary: The latest result for each checked pull request, newest first
      responses:
        "200":
          description: Checked pull requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestResultList"
        "404":
          description: No such project in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /github/repositories:
    get:
      operationId: listGitHubRepositories
      tags: [projects]
      summary: Repositories the signed-in person can see through the ScopeCI GitHub App
      responses:
        "200":
          description: Repositories, and where to install the App for more
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositoryList"
        "401":
          description: Not signed in, or GitHub access expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/contact:
    get:
      operationId: listContactMessages
      tags: [admin]
      summary: Messages sent through the contact form, newest first (at most 500)
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageList"
        "401":
          description: Not signed in to the admin page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/contact/{id}:
    delete:
      operationId: deleteContactMessage
      tags: [admin]
      summary: Delete one message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      responses:
        "204":
          description: Deleted
        "400":
          description: The id isn't a message id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in to the admin page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No message with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    InviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        maxLength: 36
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WaitlistSignupInput:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        agency:
          type: ["string", "null"]
          maxLength: 160
        # Attribution captured from the landing URL. No maxLength here on
        # purpose: an over-long campaign tag must not turn a valid signup into
        # a 400, so the server truncates these instead.
        utmSource:
          type: ["string", "null"]
        utmMedium:
          type: ["string", "null"]
        utmCampaign:
          type: ["string", "null"]
        utmContent:
          type: ["string", "null"]
        utmTerm:
          type: ["string", "null"]
        referrer:
          type: ["string", "null"]
        website_url_hp:
          type: ["string", "null"]

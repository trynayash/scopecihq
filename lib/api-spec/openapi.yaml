          type: string
          maxLength: 36
          description: >-
            The result the PM accepted (PullRequestResult.evaluationId). Names the exact pull request when a project's
            results hold two with the same number (it moved to another repository); 409 if it isn't that pull
            request's latest result.
      required:
        - reason

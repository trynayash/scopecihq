openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waitlist
    description: Early access signup operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /waitlist:
    post:
      operationId: createWaitlistSignup
      tags: [waitlist]
      summary: Join the ScopeCI waitlist
      description: Stores an agency contact for early access updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistSignupInput"
      responses:
        "201":
          description: Waitlist signup created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistSignup"
        "409":
          description: Email is already on the waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid waitlist signup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WaitlistSignupInput:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        agency:
          type: ["string", "null"]
          maxLength: 160
      required:
        - email
    WaitlistSignup:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        agency:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - agency
        - createdAt
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error


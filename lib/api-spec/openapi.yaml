      type: object
      properties:
        started:
          type: boolean
      required:
        - started
    PullRequestResult:
      type: object
      properties:
        evaluationId:
          type: string
        number:
          type: integer
        title:
          type: string
        url:
          type: string
        branch:
          type: ["string", "null"]
        prState:
          type: string
          enum: [OPEN, CLOSED, MERGED]
        headSha:
          type: ["string", "null"]
        verdict:
          type: string
          enum: [IN_SCOPE, REVIEW_REQUIRED, CHANGE_REQUIRED, APPROVED_CHANGE, BLOCKED, OVERRIDDEN]
        reason:
          type: string
        estimate:
          type: ["string", "null"]
        changeOrder:
          oneOf:
            - $ref: "#/components/schemas/DemoChangeOrder"
            - type: "null"
        trackedChangeOrder:
          oneOf:
            - $ref: "#/components/schemas/TrackedChangeOrder"
            - type: "null"
        excluded:
          type: array
          description: Work this pull request builds that the scope excludes, each with the clause that excludes it. Empty unless the result names excluded work.
          items:
            $ref: "#/components/schemas/ExcludedItem"
        files:
          type: array
          description: The changed files the check read for this commit, by name and line count only (never their contents). Files cited for excluded work come first. Empty when the commit's file list wasn't recorded.
          items:
            $ref: "#/components/schemas/ChangedFile"
        fileCount:
          type: integer
          description: How many files the commit changes. Can exceed the length of files, which is capped.
        scopeVersion:
          type: ["string", "null"]
          description: The scope version this result was checked against, like "v3". Null for results from before versions were recorded.
        acceptance:
          description: The PM's standing decision to let this pull request's flagged work through without a change order, if any.
          oneOf:
            - $ref: "#/components/schemas/Acceptance"
            - type: "null"
        previousChangeOrder:
          description: >-
            An earlier change order on this pull request that the client already decided, when a later push added
            excluded work it doesn't cover. That new work is the current draft; this one is for reference.
          oneOf:
            - $ref: "#/components/schemas/TrackedChangeOrder"
            - type: "null"
        newItems:
          type: array
          items:
            type: string
          description: >-
            The excluded work a new change order would list: what no decided change order on this pull request lists.
            Empty when trackedChangeOrder is set (its items are the list).
        checkedAt:
          type: string
          format: date-time
      required:
        - scopeVersion
        - acceptance
        - previousChangeOrder
        - newItems
        - trackedChangeOrder
        - evaluationId
        - number
        - title
        - url
        - branch
        - prState
        - headSha
        - verdict
        - reason
        - estimate
        - changeOrder
        - excluded
        - files
        - fileCount
        - checkedAt

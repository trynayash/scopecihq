name: ScopeCI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Supply-chain security audit
        run: pnpm audit --audit-level=high

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Phase 0 Deterministic Alpha Simulator
        run: pnpm run simulate

      - name: Build production bundles
        run: pnpm run build
